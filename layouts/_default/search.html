{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{- with .Description }}<p class="post-description">{{ . }}</p>{{ end }}
  {{- if not (.Param "hideMeta") }}
  <div class="post-meta">{{ partial "translation_list.html" . }}</div>
  {{- end }}
</header>
<div id="searchbox">
  <div class="search-field">
    {{- partial "windypath/icon.html" "search" }}
    <input id="searchInput" type="search" aria-label="{{ .Title }}"
      placeholder="{{ .Params.placeholder | default (i18n "wp_search_placeholder") }}" autocomplete="off" maxlength="64" autofocus>
  </div>
  <ul id="searchResults" aria-label="{{ i18n "wp_search_results" }}"></ul>
</div>
{{ end }}
